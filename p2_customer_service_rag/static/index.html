<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ShopMind 智能客服 RAG · 演示台</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    background: #f4f6fb; color: #1f2430; height: 100vh; display: flex;
    flex-direction: column;
  }
  header {
    background: linear-gradient(135deg, #2b3a67, #3f5aa9);
    color: #fff; padding: 14px 22px; display: flex; align-items: baseline; gap: 12px;
  }
  header h1 { font-size: 18px; font-weight: 600; }
  header span { font-size: 12px; opacity: .85; }
  #main { flex: 1; display: flex; min-height: 0; }
  #chatCol { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #msgs {
    flex: 1; overflow-y: auto; padding: 18px 20px; display: flex;
    flex-direction: column; gap: 14px;
  }
  .row { display: flex; }
  .row.user { justify-content: flex-end; }
  .bubble {
    max-width: 78%; padding: 10px 14px; border-radius: 12px; line-height: 1.55;
    white-space: pre-wrap; word-break: break-word; font-size: 14px;
  }
  .row.user .bubble { background: #3f5aa9; color: #fff; border-bottom-right-radius: 3px; }
  .row.bot .bubble { background: #fff; border: 1px solid #e3e8f2; border-bottom-left-radius: 3px; box-shadow: 0 1px 2px rgba(20,30,60,.05); }
  .meta { font-size: 12px; color: #66708a; margin-top: 6px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .tag { padding: 1px 8px; border-radius: 10px; font-size: 11px; font-weight: 600; }
  .tag.ok { background: #e3f6e8; color: #1a7f37; }
  .tag.reject { background: #fdeaea; color: #c62828; }
  .tag.cache { background: #fff3d6; color: #9a6700; }
  .src { font-size: 12px; color: #2b3a67; background: #eef1f8; border-radius: 6px; padding: 1px 7px; }
  #inputBar {
    border-top: 1px solid #dfe5f0; background: #fff; padding: 12px 16px;
    display: flex; gap: 10px;
  }
  #q {
    flex: 1; border: 1px solid #cdd6e8; border-radius: 8px; padding: 10px 14px;
    font-size: 14px; outline: none;
  }
  #q:focus { border-color: #3f5aa9; }
  #send {
    background: #3f5aa9; color: #fff; border: none; border-radius: 8px;
    padding: 0 22px; font-size: 14px; cursor: pointer;
  }
  #send:disabled { background: #9aa7c9; cursor: wait; }
  #presets {
    padding: 10px 16px; display: flex; gap: 8px; flex-wrap: wrap; background: #fbfcfe;
    border-top: 1px dashed #dfe5f0;
  }
  .pbtn {
    font-size: 12px; color: #3f5aa9; background: #fff; border: 1px solid #cdd6e8;
    border-radius: 14px; padding: 4px 12px; cursor: pointer;
  }
  .pbtn:hover { background: #eef1f8; }
  #side {
    width: 240px; border-left: 1px solid #dfe5f0; background: #fbfcfe;
    padding: 16px; overflow-y: auto; font-size: 12px; color: #556080;
  }
  #side h3 { font-size: 13px; color: #2b3a67; margin-bottom: 8px; }
  #side li { margin: 6px 0 6px 16px; line-height: 1.5; }
  #side code { background: #eef1f8; padding: 0 4px; border-radius: 4px; font-size: 11px; }
  .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #f2c037; display: inline-block; margin-right: 5px; }
  .status-dot.up { background: #2da44e; }
  @media (max-width: 820px) { #side { display: none; } }
</style>
</head>
<body>
<header>
  <h1>ShopMind 智能客服 RAG</h1>
  <span>数据 → 知识 → AI 应用（P2 演示台）</span>
  <span id="healthTag" style="margin-left:auto; font-size:12px;"><span class="status-dot" id="hdot"></span><span id="htext">检查服务中…</span></span>
</header>
<div id="main">
  <div id="chatCol">
    <div id="msgs"></div>
    <div id="presets">
      <button class="pbtn" data-q="支持7天无理由退货吗">域内：7 天退货</button>
      <button class="pbtn" data-q="退款多久到账">域内：退款到账</button>
      <button class="pbtn" data-q="退款几天能到账">同义改写 → 缓存命中</button>
      <button class="pbtn" data-q="今天天气怎么样">域外 → 应拒答</button>
      <button class="pbtn" data-q="帮我写一封辞职信">域外(边界) → 应拒答</button>
    </div>
    <div id="inputBar">
      <input id="q" placeholder="输入问题，回车发送…" autocomplete="off">
      <button id="send">发送</button>
    </div>
  </div>
  <aside id="side">
    <h3>演示讲解点</h3>
    <ul>
      <li><b>缓存命中</b>：黄色 <code>cache</code> 标签 + 命中的原始问题（from_cache 可审计）</li>
      <li><b>拒答</b>：红色「转人工」标签（answerable=False，重排后阈值 0.2）</li>
      <li><b>来源</b>：蓝色 chips 显示回答引用的知识切片（title + 重排分）</li>
      <li>接口：<code>POST /chat</code>（请求/响应 JSON）</li>
      <li>自检：<code>GET /health</code></li>
      <li>交互文档：<code>/docs</code>（Swagger）</li>
    </ul>
  </aside>
</div>
<script>
const $msgs = document.getElementById('msgs');
const $q = document.getElementById('q');
const $send = document.getElementById('send');

function addRow(role, text) {
  const row = document.createElement('div');
  row.className = 'row ' + role;
  const b = document.createElement('div');
  b.className = 'bubble';
  b.textContent = text;
  row.appendChild(b);
  $msgs.appendChild(row);
  $msgs.scrollTop = $msgs.scrollHeight;
  return b;
}

function addMeta(html) {
  const m = document.createElement('div');
  m.className = 'meta';
  m.innerHTML = html;
  $msgs.appendChild(m);
  $msgs.scrollTop = $msgs.scrollHeight;
}

async function send(q) {
  if (!q.trim()) return;
  $q.value = '';
  addRow('user', q);
  $send.disabled = true;

  const t0 = performance.now();
  let data;
  try {
    const resp = await fetch('/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ query: q, use_cache: true }),
    });
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    data = await resp.json();
  } catch (e) {
    addRow('bot', '请求失败：' + e.message + '\n请确认已运行 uv run shopmind p2 serve');
    $send.disabled = false;
    return;
  }
  const dt = Math.round(performance.now() - t0);

  addRow('bot', data.answer);

  let tags = '';
  if (data.from_cache) {
    tags += '<span class="tag cache">缓存命中</span>';
    if (data.matched_query) tags += '<span style="color:#9a6700">matched_query=' + data.matched_query + '</span>';
  }
  if (data.answerable) tags += '<span class="tag ok">可回答</span>';
  else tags += '<span class="tag reject">拒答 · 建议转人工</span>';

  let srcs = '';
  if (data.sources && data.sources.length) {
    srcs = data.sources.slice(0, 3).map(s =>
      '<span class="src">' + s.title + ' · ' + (s.score !== undefined ? s.score.toFixed(3) : '') + '</span>'
    ).join(' ');
  }

  addMeta(tags + ' ' + srcs +
    '<span style="margin-left:auto">conf=' + data.confidence.toFixed(3) +
    ' · api=' + (data.latency_ms ?? dt) + 'ms</span>');
  $send.disabled = false;
}

$send.addEventListener('click', () => send($q.value));
$q.addEventListener('keydown', e => { if (e.key === 'Enter') send($q.value); });
document.querySelectorAll('.pbtn').forEach(btn =>
  btn.addEventListener('click', () => send(btn.dataset.q)));

// 服务自检
fetch('/health').then(r => r.json()).then(j => {
  document.getElementById('hdot').className = 'status-dot up';
  document.getElementById('htext').textContent = j.service + ' · ok';
}).catch(() => {
  document.getElementById('htext').textContent = '服务不可达';
});

addRow('bot', '你好，我是 ShopMind 智能客服（RAG）。\n试试下面的快捷问题，或直接输入。');
</script>
</body>
</html>
