# P5 LoRA 微调配置（finetune.py 通过 pyyaml 读取）
# 说明：这是可选本地路径，4060(8GB) 可跑 3B 模型 + r=8 LoRA；
#       也可用环境变量 SFT_BASE_MODEL 覆盖 model_name。
model_name: Qwen/Qwen2.5-3B-Instruct

# LoRA 结构
r: 8
lora_alpha: 16
lora_dropout: 0.05
target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj

# 训练超参
lr: 2e-4
epochs: 3
batch_size: 1
gradient_accumulation_steps: 8
max_seq_len: 1024
