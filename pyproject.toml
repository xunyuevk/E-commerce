[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "shopmind"
version = "0.1.0"
description = "数据 → 知识 → AI 应用：电商客服 AI 体系化主线（5 个项目共享数据链）"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    # Web（P2/P1 服务）
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
    # 数据（MySQL / ES / Redis / MinIO）
    "sqlalchemy>=2.0",
    "pymysql>=1.1",
    "elasticsearch>=8.13,<9.0",
    "redis>=5.0",
    "minio>=7.2",
    # 配置 / HTTP / 工具
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13.7",
    "pyyaml>=6.0",
    # 文本 / 向量
    "numpy>=1.26",
    "jieba>=0.42",
    "dashscope>=1.27.4",
]

[project.optional-dependencies]
# 真实 RAGAS 评测（自研轻量评测已内置，这个是可选替代）
eval = ["ragas>=0.1.9"]
# P5 LoRA 微调（体积大，建议独立 venv，见 p5_lora_finetune/README.md）
finetune = [
    "torch>=2.2",
    "transformers>=4.40",
    "peft>=0.10",
    "datasets>=2.18",
    "accelerate>=0.29",
    "trl>=0.8",
]

[project.scripts]
shopmind = "shopmind.cli:app"

[tool.hatch.build.targets.wheel]
packages = [
    "shopmind",
    "p1_data_platform",
    "p2_customer_service_rag",
    "p3_live_insight",
    "p4_material_agent",
    "p5_lora_finetune",
]

[tool.uv]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"
